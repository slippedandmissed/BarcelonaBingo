volumes:
  bingo_postgres:

configs:
  adminer-index.php:
    file: ./adminer_index.dev.php

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bingo_server
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bingo
    restart: unless-stopped
    volumes:
      - bingo_postgres:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    environment:
      ADMINER_DEFAULT_DRIVER: pgsql
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DEFAULT_DB: bingo
      ADMINER_DEFAULT_USERNAME: bingo_server
      ADMINER_DEFAULT_PASSWORD: password
    restart: unless-stopped
    depends_on:
      - postgres
    configs:
      - source: adminer-index.php
        target: /var/www/html/index.php

  nginx:
    image: nginx:alpine
    ports:
      - "${BINGO_PORT:-1234}:80"
    volumes:
      - ./nginx-dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - adminer
      - bingo_server

  bingo_server:
    build:
      context: ..
      dockerfile: ./backend/Dockerfile.dev
    user: ${MY_UID}:${MY_GID}
    command: ["run", "--watch", "."]
    volumes:
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
      - .:/app/backend
      - ../node_modules:/app/node_modules
    depends_on:
      - postgres
